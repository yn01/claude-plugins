<svg width="860" height="800" viewBox="0 0 860 800" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<style>
svg { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", "Noto Sans JP", "Segoe UI", Helvetica, Arial, sans-serif; }
.title { font-size: 17px; font-weight: 700; fill: #24292f; }
.sub { font-size: 12px; fill: #57606a; }
.sec { font-size: 13px; font-weight: 700; }
.th { font-size: 12.5px; font-weight: 600; }
.ts { font-size: 11px; font-weight: 400; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.5px; }
.c-gray rect   { fill: #f6f8fa; stroke: #8b949e; }  .c-gray .th { fill: #24292f; } .c-gray .ts { fill: #57606a; }
.c-purple rect { fill: #f3f0ff; stroke: #8250df; }  .c-purple .th { fill: #512a97; } .c-purple .ts { fill: #6639ba; }
.c-blue rect   { fill: #ddf4ff; stroke: #0969da; }  .c-blue .th { fill: #0550ae; } .c-blue .ts { fill: #0969da; }
.c-green rect  { fill: #dafbe1; stroke: #1a7f37; }  .c-green .th { fill: #0d4c1f; } .c-green .ts { fill: #1a7f37; }
.c-amber rect  { fill: #fff8e1; stroke: #9a6700; }  .c-amber .th { fill: #5c3d00; } .c-amber .ts { fill: #9a6700; }
.c-red rect    { fill: #ffebe9; stroke: #cf222e; }  .c-red .th { fill: #82071e; } .c-red .ts { fill: #cf222e; }
.c-teal rect   { fill: #dcfff5; stroke: #0e7a6e; }  .c-teal .th { fill: #095c54; } .c-teal .ts { fill: #0e7a6e; }
line, path.l { stroke: #8b949e; stroke-width: 1; fill: none; }
</style>
</defs>
<rect width="860" height="800" fill="#ffffff"/>
<text class="title" x="30" y="28" text-anchor="start" dominant-baseline="central" fill="#24292f">完了ゲート(優先 1)の判定フロー ― 次に作るもの</text>
<text class="sub" x="30" y="50" text-anchor="start" dominant-baseline="central" fill="#57606a">エージェントが「終わった」と止まろうとした瞬間に、その主張に実行の証拠があるかを確かめる</text>
<g class="c-purple">
<rect x="220" y="72" width="420" height="48" rx="6" stroke-width="1"/>
<text class="th" x="430.0" y="88.0" text-anchor="middle" dominant-baseline="central">エージェントが止まろうとする</text>
<text class="ts mono" x="430.0" y="104.0" text-anchor="middle" dominant-baseline="central">TaskCompleted · SubagentStop · Stop</text>
</g>
<line x1="430" y1="120" x2="430" y2="150" marker-end="url(#arrow)"/>
<text class="ts" x="442" y="135" text-anchor="start" dominant-baseline="central" fill="#57606a">フック入力:最後の報告文・タスク内容・トランスクリプトの場所</text>
<g class="c-amber">
<rect x="220" y="150" width="420" height="48" rx="6" stroke-width="1"/>
<text class="th" x="430.0" y="166.0" text-anchor="middle" dominant-baseline="central">① コードで事実を集める</text>
<text class="ts" x="430.0" y="182.0" text-anchor="middle" dominant-baseline="central">直近のテスト実行の有無・終了コード・差分の要約</text>
</g>
<line x1="430" y1="198" x2="430" y2="222" marker-end="url(#arrow)"/>
<g class="c-amber">
<rect x="280" y="222" width="300" height="40" rx="18" stroke-width="1"/>
<text class="th" x="430.0" y="242.0" text-anchor="middle" dominant-baseline="central">テストの失敗が記録されている?</text>
</g>
<line x1="580" y1="242" x2="640" y2="242" marker-end="url(#arrow)"/>
<text class="ts" x="610" y="232" text-anchor="middle" dominant-baseline="central" fill="#cf222e" font-weight="600">はい</text>
<g class="c-red">
<rect x="640" y="212" width="190" height="60" rx="6" stroke-width="1"/>
<text class="th" x="735.0" y="226.0" text-anchor="middle" dominant-baseline="central">差し戻し(Jev 不要)</text>
<text class="ts" x="735.0" y="242.0" text-anchor="middle" dominant-baseline="central">事実だけで決まるものはコードで</text>
<text class="ts" x="735.0" y="258.0" text-anchor="middle" dominant-baseline="central">Shadow 中は記録のみ</text>
</g>
<line x1="430" y1="262" x2="430" y2="296" marker-end="url(#arrow)"/>
<text class="ts" x="442" y="279" text-anchor="start" dominant-baseline="central" fill="#57606a">いいえ / 記録なし</text>
<g class="c-green">
<rect x="150" y="296" width="500" height="112" rx="6" stroke-width="1"/>
<text class="th" x="400.0" y="320.0" text-anchor="middle" dominant-baseline="central">② Jev に noul を 2 つ聞く(1 リクエストで並列)</text>
<text class="ts mono" x="400.0" y="336.0" text-anchor="middle" dominant-baseline="central">claims_done: Does final_message claim the task is done?</text>
<text class="ts mono" x="400.0" y="352.0" text-anchor="middle" dominant-baseline="central">evidence_missing: Is there NO run output in test_log</text>
<text class="ts mono" x="400.0" y="368.0" text-anchor="middle" dominant-baseline="central">                  that supports the claim?</text>
<text class="ts" x="400.0" y="384.0" text-anchor="middle" dominant-baseline="central">state = { task, final_message(日本語のまま), test_log }</text>
</g>
<g class="c-gray">
<rect x="676" y="316" width="154" height="72" rx="6" stroke-width="1" stroke-dasharray="4 3"/>
<text class="th" x="753.0" y="336.0" text-anchor="middle" dominant-baseline="central">失敗・2 秒超過</text>
<text class="ts" x="753.0" y="352.0" text-anchor="middle" dominant-baseline="central">→ exit 0</text>
<text class="ts" x="753.0" y="368.0" text-anchor="middle" dominant-baseline="central">記録だけ残して素通し</text>
</g>
<line x1="650" y1="352" x2="676" y2="352" marker-end="url(#arrow)" stroke-dasharray="4 3"/>
<line x1="430" y1="408" x2="430" y2="434" marker-end="url(#arrow)"/>
<g class="c-amber">
<rect x="220" y="434" width="420" height="36" rx="6" stroke-width="1"/>
<text class="th" x="430.0" y="452.0" text-anchor="middle" dominant-baseline="central">③ 確率をコードで 3 つに振り分ける(閾値は例)</text>
</g>
<line x1="330" y1="470" x2="170" y2="496" marker-end="url(#arrow)"/>
<line x1="430" y1="470" x2="430" y2="496" marker-end="url(#arrow)"/>
<line x1="530" y1="470" x2="690" y2="496" marker-end="url(#arrow)"/>
<g class="c-green">
<rect x="60" y="496" width="220" height="70" rx="6" stroke-width="1"/>
<text class="th" x="170.0" y="515.0" text-anchor="middle" dominant-baseline="central">通す</text>
<text class="ts" x="170.0" y="531.0" text-anchor="middle" dominant-baseline="central">claims_done が低い</text>
<text class="ts" x="170.0" y="547.0" text-anchor="middle" dominant-baseline="central">または evidence_missing &lt; 0.3</text>
</g>
<g class="c-gray">
<rect x="320" y="496" width="220" height="70" rx="6" stroke-width="1"/>
<text class="th" x="430.0" y="523.0" text-anchor="middle" dominant-baseline="central">不確実</text>
<text class="ts" x="430.0" y="539.0" text-anchor="middle" dominant-baseline="central">0.3 ≤ evidence_missing &lt; 0.7</text>
</g>
<g class="c-red">
<rect x="580" y="496" width="220" height="70" rx="6" stroke-width="1"/>
<text class="th" x="690.0" y="515.0" text-anchor="middle" dominant-baseline="central">差し戻し候補</text>
<text class="ts" x="690.0" y="531.0" text-anchor="middle" dominant-baseline="central">claims_done が高い かつ</text>
<text class="ts" x="690.0" y="547.0" text-anchor="middle" dominant-baseline="central">evidence_missing ≥ 0.7</text>
</g>
<line x1="430" y1="566" x2="430" y2="594" marker-end="url(#arrow)"/>
<text class="ts" x="442" y="580" text-anchor="start" dominant-baseline="central" fill="#57606a">④ モードで返し方が変わる</text>
<g class="c-green">
<rect x="30" y="594" width="390" height="110" rx="6" stroke-width="1"/>
<text class="th" x="225.0" y="625.0" text-anchor="middle" dominant-baseline="central">Shadow Mode(最初はこちら)</text>
<text class="ts" x="225.0" y="641.0" text-anchor="middle" dominant-baseline="central">3 つとも exit 0:作業は一切止めない</text>
<text class="ts" x="225.0" y="657.0" text-anchor="middle" dominant-baseline="central">判定・確率・入力の要約を JSONL に記録</text>
<text class="ts" x="225.0" y="673.0" text-anchor="middle" dominant-baseline="central">→ 自分の判断と突き合わせて閾値を決める</text>
</g>
<g class="c-blue">
<rect x="440" y="594" width="390" height="110" rx="6" stroke-width="1"/>
<text class="th" x="635.0" y="625.0" text-anchor="middle" dominant-baseline="central">Enforce Mode(突き合わせの後)</text>
<text class="ts" x="635.0" y="641.0" text-anchor="middle" dominant-baseline="central">通す → exit 0</text>
<text class="ts" x="635.0" y="657.0" text-anchor="middle" dominant-baseline="central">不確実 → exit 0 + systemMessage で人に知らせる</text>
<text class="ts" x="635.0" y="673.0" text-anchor="middle" dominant-baseline="central">差し戻し候補 → exit 2 + 足りない証拠を伝える</text>
</g>
<rect x="30" y="722" width="800" height="60" rx="8" fill="#fffcf0" stroke="#d4a72c" stroke-width="1"/>
<text class="ts" x="46" y="741" text-anchor="start" dominant-baseline="central" fill="#5c3d00" font-weight="700">守ること</text>
<text class="ts" x="110" y="741" text-anchor="start" dominant-baseline="central" fill="#5c3d00">・テストの合否そのものは Jev に聞かない(コードで確かめた事実が常に優先)</text>
<text class="ts" x="110" y="763" text-anchor="start" dominant-baseline="central" fill="#5c3d00">・同じタスクの差し戻しは上限回数まで(例:2 回)。超えたら止めずに人へ回し、無限ループを防ぐ</text>
</svg>
