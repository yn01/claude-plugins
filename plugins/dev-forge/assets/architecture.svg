<svg xmlns="http://www.w3.org/2000/svg" width="880" height="640" viewBox="0 0 880 640" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#868e96"/>
    </marker>
  </defs>

  <!-- Human (Architect) -->
  <rect x="310" y="18" width="260" height="56" rx="10" fill="#f8f9fa" stroke="#343a40" stroke-width="1.5"/>
  <text x="440" y="42" text-anchor="middle" font-size="13" font-weight="bold" fill="#212529">Human — The Architect</text>
  <text x="440" y="61" text-anchor="middle" font-size="10" fill="#495057">direction · system design · quality bar</text>

  <!-- Arrows: Human -> three capabilities -->
  <line x1="370" y1="74" x2="162" y2="127" stroke="#868e96" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="440" y1="74" x2="440" y2="127" stroke="#868e96" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="510" y1="74" x2="718" y2="127" stroke="#868e96" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="238" y="93" text-anchor="middle" font-size="9" fill="#868e96">picks a team</text>
  <text x="452" y="100" text-anchor="start" font-size="9" fill="#868e96">writes knowledge</text>
  <text x="640" y="93" text-anchor="middle" font-size="9" fill="#868e96">defines done</text>

  <!-- Setup column -->
  <rect x="30" y="130" width="260" height="252" rx="12" fill="#e6fcf5" stroke="#099268" stroke-width="1.5"/>
  <text x="160" y="153" text-anchor="middle" font-size="13" font-weight="bold" fill="#087f5b">Setup</text>
  <text x="160" y="169" text-anchor="middle" font-size="9.5" fill="#099268">/dev-forge:init · team → .claude/agents/</text>

  <rect x="50" y="184" width="220" height="24" rx="6" fill="#ffffff" stroke="#099268"/>
  <text x="160" y="200" text-anchor="middle" font-size="10" fill="#212529"><tspan font-weight="bold">fullstack</tspan> — 7 agents</text>
  <rect x="50" y="214" width="220" height="24" rx="6" fill="#ffffff" stroke="#099268"/>
  <text x="160" y="230" text-anchor="middle" font-size="10" fill="#212529"><tspan font-weight="bold">backend-only</tspan> — 5 agents</text>
  <rect x="50" y="244" width="220" height="24" rx="6" fill="#ffffff" stroke="#099268"/>
  <text x="160" y="260" text-anchor="middle" font-size="10" fill="#212529"><tspan font-weight="bold">minimal</tspan> — 3 agents</text>
  <rect x="50" y="278" width="220" height="26" rx="6" fill="none" stroke="#099268" stroke-dasharray="4 3"/>
  <text x="160" y="295" text-anchor="middle" font-size="9" fill="#099268">switch anytime with /dev-forge:team</text>

  <!-- Guide column -->
  <rect x="310" y="130" width="260" height="252" rx="12" fill="#e8f1fc" stroke="#1c7ed6" stroke-width="1.5"/>
  <text x="440" y="153" text-anchor="middle" font-size="13" font-weight="bold" fill="#1864ab">Guide</text>
  <text x="440" y="169" text-anchor="middle" font-size="9.5" fill="#1c7ed6">.dev-forge/guide/ — human-authored knowledge</text>

  <rect x="330" y="184" width="220" height="24" rx="6" fill="#ffffff" stroke="#1c7ed6"/>
  <text x="440" y="200" text-anchor="middle" font-size="10" font-weight="bold" fill="#212529">guidelines/</text>
  <rect x="330" y="214" width="220" height="24" rx="6" fill="#ffffff" stroke="#1c7ed6"/>
  <text x="440" y="230" text-anchor="middle" font-size="10" fill="#212529"><tspan font-weight="bold">decisions/</tspan> (ADR)</text>
  <rect x="330" y="244" width="220" height="24" rx="6" fill="#ffffff" stroke="#1c7ed6"/>
  <text x="440" y="260" text-anchor="middle" font-size="10" font-weight="bold" fill="#212529">concepts/</text>
  <rect x="330" y="274" width="220" height="24" rx="6" fill="#d0ebff" stroke="#1c7ed6"/>
  <text x="440" y="290" text-anchor="middle" font-size="10" fill="#212529"><tspan font-weight="bold">index.md</tspan> — catalogue</text>
  <rect x="330" y="306" width="220" height="26" rx="6" fill="none" stroke="#1c7ed6" stroke-dasharray="4 3"/>
  <text x="440" y="323" text-anchor="middle" font-size="9" fill="#1c7ed6">SessionStart hook injects the index only</text>

  <!-- Gate column -->
  <rect x="590" y="130" width="260" height="252" rx="12" fill="#fff4e6" stroke="#e8590c" stroke-width="1.5"/>
  <text x="720" y="153" text-anchor="middle" font-size="13" font-weight="bold" fill="#d9480f">Gate</text>
  <text x="720" y="169" text-anchor="middle" font-size="9.5" fill="#e8590c">.dev-forge/gate/ — machine-verified done</text>

  <rect x="610" y="184" width="220" height="24" rx="6" fill="#ffffff" stroke="#e8590c"/>
  <text x="720" y="200" text-anchor="middle" font-size="10" fill="#212529"><tspan font-weight="bold">active/</tspan> — open gates</text>
  <rect x="610" y="214" width="220" height="24" rx="6" fill="#ffffff" stroke="#e8590c"/>
  <text x="720" y="230" text-anchor="middle" font-size="10" fill="#212529"><tspan font-weight="bold">archive/</tspan> — reusable templates</text>
  <rect x="610" y="244" width="220" height="24" rx="6" fill="#ffe8cc" stroke="#e8590c"/>
  <text x="720" y="260" text-anchor="middle" font-size="10" fill="#212529"><tspan font-weight="bold">index.md</tspan> — catalogue</text>
  <rect x="610" y="274" width="220" height="26" rx="6" fill="none" stroke="#e8590c" stroke-dasharray="4 3"/>
  <text x="720" y="291" text-anchor="middle" font-size="9" fill="#e8590c">pre-commit hook warns on open gates</text>
  <text x="720" y="322" text-anchor="middle" font-size="9" font-style="italic" fill="#d9480f">no criterion without a verification command</text>

  <!-- Arrows: columns -> pipeline -->
  <line x1="160" y1="382" x2="160" y2="436" stroke="#868e96" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="440" y1="382" x2="440" y2="436" stroke="#868e96" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="720" y1="382" x2="720" y2="436" stroke="#868e96" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="168" y="414" text-anchor="start" font-size="9" fill="#868e96">agent definitions</text>
  <text x="448" y="414" text-anchor="start" font-size="9" fill="#868e96">index → context</text>
  <text x="712" y="414" text-anchor="end" font-size="9" fill="#868e96">definition of done</text>

  <!-- Agent pipeline -->
  <rect x="30" y="438" width="820" height="118" rx="12" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.5"/>
  <text x="440" y="462" text-anchor="middle" font-size="13" font-weight="bold" fill="#5f3dc4">Agent Pipeline</text>

  <rect x="45" y="478" width="100" height="46" rx="6" fill="#ffffff" stroke="#7048e8"/>
  <text x="95" y="497" text-anchor="middle" font-size="10" font-weight="bold" fill="#212529">researcher</text>
  <text x="95" y="512" text-anchor="middle" font-size="8" fill="#7048e8">haiku</text>
  <line x1="145" y1="501" x2="156" y2="501" stroke="#868e96" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="158" y="478" width="100" height="46" rx="6" fill="#ffffff" stroke="#7048e8"/>
  <text x="208" y="497" text-anchor="middle" font-size="10" font-weight="bold" fill="#212529">story-writer</text>
  <text x="208" y="512" text-anchor="middle" font-size="8" fill="#7048e8">sonnet</text>
  <line x1="258" y1="501" x2="269" y2="501" stroke="#868e96" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="271" y="478" width="100" height="46" rx="6" fill="#ffffff" stroke="#7048e8"/>
  <text x="321" y="497" text-anchor="middle" font-size="10" font-weight="bold" fill="#212529">spec-writer</text>
  <text x="321" y="512" text-anchor="middle" font-size="8" fill="#7048e8">sonnet</text>
  <line x1="371" y1="501" x2="382" y2="501" stroke="#868e96" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="384" y="478" width="100" height="46" rx="6" fill="#ffffff" stroke="#7048e8"/>
  <text x="434" y="493" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#212529">backend-</text>
  <text x="434" y="504" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#212529">builder</text>
  <text x="434" y="517" text-anchor="middle" font-size="8" fill="#7048e8">sonnet</text>
  <line x1="484" y1="501" x2="495" y2="501" stroke="#868e96" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="497" y="478" width="100" height="46" rx="6" fill="#ffffff" stroke="#7048e8"/>
  <text x="547" y="493" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#212529">frontend-</text>
  <text x="547" y="504" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#212529">builder</text>
  <text x="547" y="517" text-anchor="middle" font-size="8" fill="#7048e8">sonnet</text>
  <line x1="597" y1="501" x2="608" y2="501" stroke="#868e96" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="610" y="478" width="100" height="46" rx="6" fill="#ffffff" stroke="#7048e8"/>
  <text x="660" y="497" text-anchor="middle" font-size="10" font-weight="bold" fill="#212529">test-verifier</text>
  <text x="660" y="512" text-anchor="middle" font-size="8" fill="#7048e8">sonnet</text>
  <line x1="710" y1="501" x2="721" y2="501" stroke="#868e96" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="723" y="478" width="100" height="46" rx="6" fill="#ffffff" stroke="#7048e8"/>
  <text x="773" y="497" text-anchor="middle" font-size="10" font-weight="bold" fill="#212529">validator</text>
  <text x="773" y="512" text-anchor="middle" font-size="8" fill="#7048e8">sonnet</text>

  <!-- Storage footer -->
  <rect x="30" y="576" width="820" height="44" rx="10" fill="none" stroke="#adb5bd" stroke-dasharray="5 4"/>
  <text x="440" y="602" text-anchor="middle" font-size="11" fill="#495057">Everything is plain Markdown — Git-tracked, human-editable, shared with your team</text>
</svg>
